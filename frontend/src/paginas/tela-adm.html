<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>HVAC Lex Company — Painel Administrativo</title>

    <link rel="icon" href="../../assets/logoHVAC.png" />
    <link rel="stylesheet" href="../css/dashboardAdmin.css" />

    <script src="../js/dashboardAdmin.js" defer></script>
  </head>

  <body>
    <header class="header">
      <div class="brand">
        <div class="logo">
          <img
            src="../../assets/logoHVAC.png"
            alt="Logo HVAC Lex Company"
            style="
              display: block;
              width: 100%;
              height: 100%;
              object-fit: contain;
            "
          />
        </div>

        <div>
          <div class="brand-title">PAINEL ADMINISTRATIVO</div>
          <small>HVAC Lex Company</small>
        </div>
      </div>

      <div class="actions">
        <button
          type="button"
          class="notification"
          id="notifications"
          aria-label="Ver pedidos pendentes"
        >
          🔔
          <span class="count" id="notification-count">0</span>
        </button>

        <button type="button" class="primary" id="new-order">
          + Novo Pedido
        </button>

        <div class="profile">
          <div class="avatar">AD</div>

          <div>
            <strong>Admin</strong>

            <button type="button" id="logout-btn" class="logout-btn">
              Sair →
            </button>
          </div>
        </div>
      </div>
    </header>

    <nav aria-label="Navegação principal">
      <button
        type="button"
        class="tab active"
        data-page="overview"
        aria-current="page"
      >
        ◉ Visão Geral
      </button>

      <button type="button" class="tab" data-page="requests">
        ▤ Solicitações
        <span class="count" id="pending-count">0</span>
      </button>

      <button type="button" class="tab" data-page="history">▪ Histórico</button>

      <button type="button" class="tab" data-page="schedule">▦ Agenda</button>

      <button type="button" class="tab" data-page="portfolio">
        ▣ Portfólio
      </button>
    </nav>

    <main id="content"></main>

    <noscript>
      <p>Ative o JavaScript do navegador para utilizar o painel.</p>
    </noscript>

    <dialog id="order-dialog" aria-labelledby="dialog-title">
      <h2 id="dialog-title">Novo pedido</h2>

      <form id="order-form">
        <label>
          Nome do cliente

          <input
            type="text"
            name="client"
            required
            maxlength="80"
            placeholder="Ex.: Ana Silva"
          />
        </label>

        <div class="form-grid">
          <label>
            Equipamento

            <select name="equipment">
              <option value="Ar Condicionado">Ar Condicionado</option>
              <option value="Geladeira">Geladeira</option>
              <option value="Câmara Fria">Câmara Fria</option>
              <option value="Freezer">Freezer</option>
              <option value="Elétrica">Elétrica</option>
            </select>
          </label>

          <label>
            Técnico

            <select name="technician">
              <option value="Ricardo Lopes">Ricardo Lopes</option>
              <option value="Paulo Henrique">Paulo Henrique</option>
              <option value="Marcos Silva">Marcos Silva</option>
            </select>
          </label>
        </div>

        <div class="form-grid">
          <label>
            Data
            <input type="date" name="date" required />
          </label>

          <label>
            Horário
            <input type="time" name="time" required />
          </label>
        </div>

        <label class="checkbox">
          <input type="checkbox" name="urgent" />
          Pedido urgente
        </label>

        <div class="form-actions">
          <button type="button" class="secondary" id="cancel-order">
            Cancelar
          </button>

          <button type="submit" class="primary">Cadastrar pedido</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
