<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>HVAC Lex Company — Painel Administrativo</title>

    <link rel="icon" href="../../assets/logoHVAC.png" />
    <link rel="stylesheet" href="../css/dashboardAdmin.css" />

    <script src="../js/proteger-admin.js" defer></script>
    <script src="../js/dashboardAdmin.js?v=20261030-5" defer></script>
  </head>

  <body>
    <header class="header">
      <div class="brand">
        <div class="logo">
          <img
            src="../../assets/logoHVAC.png"
            alt="Logo HVAC Lex Company"
            style="
              display: block;
              width: 100%;
              height: 100%;
              object-fit: contain;
            "
          />
        </div>

        <div>
          <div class="brand-title">PAINEL ADMINISTRATIVO</div>
          <small>HVAC Lex Company</small>
        </div>
      </div>

      <div class="actions">
        <button
          type="button"
          class="notification"
          id="notifications"
          aria-label="Ver pedidos pendentes"
        >
          🔔
          <span class="count" id="notification-count">0</span>
        </button>

        <button type="button" class="primary" id="new-order">
          + Novo Pedido
        </button>

        <div class="profile">
          <div class="avatar">AD</div>

          <div>
            <strong>Admin</strong>

            <button type="button" id="logout-btn" class="logout-btn">
              Sair →
            </button>
          </div>
        </div>
      </div>
    </header>

    <nav aria-label="Navegação principal">
      <button
        type="button"
        class="tab active"
        data-page="overview"
        aria-current="page"
      >
        ◉ Visão Geral
      </button>

      <button type="button" class="tab" data-page="requests">
        ▤ Solicitações
        <span class="count" id="pending-count">0</span>
      </button>

      <button type="button" class="tab" data-page="history">▪ Histórico</button>

      <button type="button" class="tab" data-page="schedule">▦ Agenda</button>

      <button type="button" class="tab" data-page="portfolio">
        ▣ Portfólio
      </button>
    </nav>

    <main id="content"></main>

    <noscript>
      <p>Ative o JavaScript do navegador para utilizar o painel.</p>
    </noscript>

    <dialog id="notifications-dialog" class="admin-notifications-dialog" aria-labelledby="notifications-title">
      <div class="order-dialog-heading">
        <div>
          <h2 id="notifications-title">Notificações</h2>
          <p id="notifications-summary">0 não lida(s)</p>
        </div>
        <button type="button" class="order-dialog-close" id="close-notifications" aria-label="Fechar">×</button>
      </div>
      <p id="admin-notification-feedback" role="status" hidden></p>
      <div id="admin-notification-list" class="admin-notification-list"></div>
      <div class="form-actions">
        <button type="button" class="secondary" id="mark-notifications-read">Marcar todas como lidas</button>
        <button type="button" class="secondary" id="clear-read-notifications">Limpar notificações lidas</button>
      </div>
    </dialog>

    <dialog
      id="order-dialog"
      class="order-dialog"
      aria-labelledby="dialog-title"
    >
      <div class="order-dialog-heading">
        <h2 id="dialog-title">Adicionar Pedido</h2>
        <button
          type="button"
          class="order-dialog-close"
          id="close-order"
          aria-label="Fechar"
        >
          ×
        </button>
      </div>

      <form id="order-form">
        <div class="form-grid">
          <label class="order-field">
            Cliente *
            <input
              type="text"
              name="client"
              required
              maxlength="150"
              autocomplete="name"
              placeholder="Nome do cliente"
            />
          </label>
          <label class="order-field">
            Telefone
            <input
              type="tel"
              name="phone"
              maxlength="25"
              autocomplete="tel"
              placeholder="(15) 9xxxx-xxxx"
            />
          </label>
        </div>

        <label class="order-field order-field-full">
          Vincular à conta do cliente (opcional)
          <select name="client_id" disabled>
            <option value="">Informe o telefone para buscar contas</option>
          </select>
          <small class="order-client-feedback" id="client-match-feedback" role="status">
            O pedido só aparece no painel do cliente quando for vinculado a uma conta.
          </small>
        </label>

        <label class="order-field order-field-full">
          Tipo de Serviço
          <select name="equipment" required>
            <option value="">Carregando serviços...</option>
          </select>
        </label>

        <div class="form-grid">
          <label class="order-field">
            Data *
            <input type="date" name="date" required />
          </label>
          <label class="order-field">
            Horário *
            <select name="time" required disabled>
              <option value="">Selecione uma data</option>
            </select>
          </label>
        </div>

        <label class="order-field order-field-full">
          Endereço *
          <input
            type="text"
            name="address"
            required
            maxlength="500"
            autocomplete="street-address"
            placeholder="Rua, número — Bairro"
          />
        </label>

        <label class="order-field order-field-full">
          Descrição do Problema
          <textarea
            name="description"
            maxlength="3000"
            rows="3"
            placeholder="Descreva o problema..."
          ></textarea>
        </label>

        <div class="form-grid">
          <label class="order-field">
            Técnico
            <select name="technician">
              <option value="">Não atribuído</option>
            </select>
          </label>
          <label class="order-field">
            Prioridade
            <select name="priority">
              <option value="normal">Normal</option>
              <option value="urgente">Urgente</option>
            </select>
          </label>
        </div>

        <p class="order-feedback" id="order-feedback" role="alert" hidden></p>

        <div class="form-actions order-form-actions">
          <button type="button" class="secondary" id="cancel-order">
            Cancelar
          </button>
          <button type="submit" class="primary" id="submit-order">
            Adicionar
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>
