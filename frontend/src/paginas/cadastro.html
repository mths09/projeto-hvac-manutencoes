    </div>

    <main class="conteudo-central">

      <div class="card">
        <img src="../../assets/logoHVAC.png" alt="Logo HVAC Manutenções" />

        <h1>Crie sua conta</h1>
        <p>Cadastre-se para acompanhar seus serviços e agendamentos.</p>
        <form
          id="form-cadastro"
          action="../../../backend/cadastro.php"
          method="POST"
        >
          <div class="campos-cadastro">
            <div>
              <label for="nome">Nome</label>
              <input
                type="text"
                id="nome"
                name="nome"
                autocomplete="given-name"
                maxlength="74"
                required
                aria-describedby="erro-nome"
              />
              <small
                id="erro-nome"
                class="erro-campo"
                aria-live="polite"
              ></small>
            </div>
            <div>
              <label for="sobrenome">Sobrenome</label>
              <input
                type="text"
                id="sobrenome"
                name="sobrenome"
                autocomplete="family-name"
                maxlength="74"
                required
                aria-describedby="erro-sobrenome"
              />
              <small
                id="erro-sobrenome"
                class="erro-campo"
                aria-live="polite"
              ></small>
            </div>
            <div class="campo-inteiro">
              <label for="email">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
                aria-describedby="erro-email"
              />

              <small
                id="erro-email"
                class="erro-campo"
                aria-live="polite"
              ></small>
            </div>
            <div>
              <label for="telefone">Telefone com DDD</label>
              <input
                type="tel"
                id="telefone"
                name="telefone"
                autocomplete="tel"
                placeholder="(15) 99999-9999"
                required
                aria-describedby="erro-telefone"
              />

              <small
                id="erro-telefone"
                class="erro-campo"
                aria-live="polite"
              ></small>
            </div>
            <div>
              <label for="data_nascimento">Data de nascimento</label>
              <input
                type="date"
                id="data_nascimento"
                name="data_nascimento"
                autocomplete="bday"
                required
                aria-describedby="erro-data_nascimento"
              />

              <small
                id="erro-data_nascimento"
                class="erro-campo"
                aria-live="polite"
              ></small>
            </div>
            <div>
              <label for="senha">Senha</label>
              <input
                type="password"
                id="senha"
                name="senha"
                autocomplete="new-password"
                minlength="8"
                aria-describedby="ajuda-senha erro-senha"
                required
              />

              <small
                id="erro-senha"
                class="erro-campo"
                aria-live="polite"
              ></small>
            </div>
            <div>
              <label for="confirmar_senha">Confirme a senha</label>
              <input
                type="password"
                id="confirmar_senha"
                name="confirmar_senha"
                autocomplete="new-password"
                minlength="8"
                required
                aria-describedby="erro-confirmar_senha"
              />
              <small
                id="erro-confirmar_senha"
                class="erro-campo"
                aria-live="polite"
              >
              </small>
            </div>
          </div>
          <p id="ajuda-senha" class="ajuda-cadastro">
            Use pelo menos 8 caracteres.
          </p>

          <fieldset class="grupo-endereco">
            <legend>Endereço</legend>

            <div class="campos-cadastro">
              <div>
                <label for="cep">CEP</label>
                <input
                  type="text"
                  id="cep"
                  name="cep"
                  inputmode="numeric"
                  autocomplete="postal-code"
                  placeholder="00000-000"
                  maxlength="9"
                  required
                  aria-describedby="status-cep erro-cep"
                />
                <small
                  id="status-cep"
                  class="ajuda-cadastro"
                  role="status"
                ></small>
                <small
                  id="erro-cep"
                  class="erro-campo"
                  aria-live="polite"
                ></small>
              </div>
              <div>
                <label for="numero">Número</label>
                <input
                  type="text"
                  id="numero"
                  name="numero"
                  autocomplete="off"
                  maxlength="20"
                  placeholder="Use S/N se não houver"
                  required
                  aria-describedby="erro-numero"
                />
                <small
                  id="erro-numero"
                  class="erro-campo"
                  aria-live="polite"
                ></small>
              </div>
              <div class="campo-inteiro">
                <label for="logradouro">Rua / logradouro</label>
                <input
                  type="text"
                  id="logradouro"
                  name="logradouro"
                  autocomplete="address-line1"
                  maxlength="180"
                  required
                  aria-describedby="erro-logradouro"
                />
                <small
                  id="erro-logradouro"
                  class="erro-campo"
                  aria-live="polite"
                ></small>
              </div>
              <div>
                <label for="complemento">Complemento (opcional)</label>
                <input
                  type="text"
                  id="complemento"
                  name="complemento"
                  autocomplete="address-line2"
                  maxlength="120"
                  aria-describedby="erro-complemento"
                />
                <small
                  id="erro-complemento"
                  class="erro-campo"
                  aria-live="polite"
                ></small>
              </div>
              <div>
                <label for="bairro">Bairro</label>
                <input
                  type="text"
                  id="bairro"
                  name="bairro"
                  autocomplete="off"
                  maxlength="100"
                  required
                  aria-describedby="erro-bairro"
                />
                <small
                  id="erro-bairro"
                  class="erro-campo"
                  aria-live="polite"
                ></small>
              </div>
              <div>
                <label for="cidade">Cidade</label>
                <input
                  type="text"
                  id="cidade"
                  name="cidade"
                  autocomplete="address-level2"
                  maxlength="100"
                  required
                  aria-describedby="erro-cidade"
                />
                <small
                  id="erro-cidade"
                  class="erro-campo"
                  aria-live="polite"
                ></small>
              </div>
              <div>
                <label for="uf">UF</label>
                <input
                  type="text"
                  id="uf"
                  name="uf"
                  autocomplete="address-level1"
                  maxlength="2"
                  placeholder="SP"
                  required
                  aria-describedby="erro-uf"
                />
                <small
                  id="erro-uf"
                  class="erro-campo"
                  aria-live="polite"
                ></small>
              </div>
            </div>
          </fieldset>

          <p id="mensagem-cadastro" role="status" aria-live="polite" hidden></p>
          <button type="submit" class="btn-entrar">Criar minha conta →</button>
          <div class="divisor"><span>Já tem uma conta?</span></div>
          <a class="btn-cadastro" href="./login.html">Entrar na conta</a>
        </form>
      </div>

      <footer class="rodape-card">© 2026 HVAC Lex Company</footer>
    </main>
