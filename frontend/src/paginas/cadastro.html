    <!-- Ondas decorativas à esquerda -->
    <div class="wave-decor wave-left" aria-hidden="true">
      <svg
        viewBox="0 0 300 600"
        xmlns="http://www.w3.org/2000/svg"
        preserveAspectRatio="none"
      >
        <defs>
          <linearGradient id="waveGradient1b" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="45%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#a3915a" />
          </linearGradient>

          <linearGradient id="waveGradient2b" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#2563eb" />
            <stop offset="50%" stop-color="#6d28d9" />
            <stop offset="100%" stop-color="#8a7a4a" />
          </linearGradient>

          <linearGradient id="waveGradient3b" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#1d4ed8" />
            <stop offset="55%" stop-color="#5b21b6" />
            <stop offset="100%" stop-color="#6b6a3a" />
          </linearGradient>
        </defs>

        <path

        />

    </div>

    <main class="conteudo-central">
      <a href="../../../index.html" class="voltar-site"> ← Voltar ao site </a>

      <div class="card">
        <img src="../../assets/logoHVAC.png" alt="Logo HVAC Manutenções" />

        <h1>Crie sua conta</h1>
        <p>Cadastre-se para acompanhar seus serviços e agendamentos.</p>
        <form
          id="form-cadastro"
          action="../../../backend/cadastro.php"
          method="POST"
        >
          <div class="campos-cadastro">
            <div class="campo-inteiro">
              <label for="nome">Nome completo</label>
              <input
                type="text"
                id="nome"
                name="nome"
                autocomplete="name"
                required
              />
            </div>
            <div class="campo-inteiro">
              <label for="email">E-mail</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
                required
              />
            </div>
            <div>
              <label for="telefone">Telefone com DDD</label>
              <input
                type="tel"
                id="telefone"
                name="telefone"
                autocomplete="tel"
                placeholder="(15) 99999-9999"
                required
              />
            </div>
            <div>
              <label for="data_nascimento">Data de nascimento</label>
              <input
                type="date"
                id="data_nascimento"
                name="data_nascimento"
                autocomplete="bday"
                required
              />
            </div>
            <div>
              <label for="senha">Senha</label>
              <input
                type="password"
                id="senha"
                name="senha"
                autocomplete="new-password"
                minlength="8"
                aria-describedby="ajuda-senha"
                required
              />
            </div>
            <div>
              <label for="confirmar_senha">Confirme a senha</label>
              <input
                type="password"
                id="confirmar_senha"
                name="confirmar_senha"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>
          </div>
          <p id="ajuda-senha" class="ajuda-cadastro">
            Use pelo menos 8 caracteres.
          </p>
          <p id="mensagem-cadastro" role="status" aria-live="polite" hidden></p>
          <button type="submit" class="btn-entrar">Criar minha conta →</button>
          <div class="divisor"><span>Já tem uma conta?</span></div>
          <a class="btn-cadastro" href="./login.html">Entrar na conta</a>
        </form>
      </div>

      <footer class="rodape-card">© 2026 HVAC Lex Company</footer>
    </main>
  </body>
</html>
